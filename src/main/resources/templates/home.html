<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket System</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>

    <header>
    <div class="header-content">

        <h1>Ticket System</h1>

        <form th:action="@{/logout}" method="post">
            <button
                type="submit"
                class="logout-button">
                Sair
            </button>
        </form>

        <a th:href="@{/users/me}" class="profile-link" id="profile-link">
            Meu Perfil
        </a>

        <a href="/project" class="back-projects">
            ← Voltar aos projetos
        </a>

    </div>
    </header>
    <main>

        <div class="page-header">
            <h2>Tickets
                <span class="project-name" th:text="|— ${project.name}|"></span>
            </h2>

            <a id="new-ticket-button" class="new-ticket-button" href="#">
                Novo Ticket
            </a>
        </div>

        <div class="filter-container">
            <label for="status-filter">Filtrar por status</label>

            <select id="status-filter">
                <option value="">Todos</option>
                <option value="OPEN">Aberto</option>
                <option value="IN_PROGRESS">Em andamento</option>
                <option value="RESOLVED">Resolvido</option>
                <option value="CLOSED">Encerrado</option>
            </select>
        </div>

        <div class="filter-container">
            <label for="priority-filter">Filtrar por prioridade</label>

            <select id="priority-filter">
                <option value="">Todas</option>
                <option value="LOW">Baixa</option>
                <option value="MEDIUM">Média</option>
                <option value="HIGH">Alta</option>
                <option value="URGENT">Crítica</option>
            </select>
        </div>
        <div class="filter-container">
            <label for="sort-filter">Ordenar por</label>

            <select id="sort-filter">
                <option value="created-desc">Data de criação (Mais recentes primeiro)</option>
                <option value="created-asc">Data de criação (Mais antigos primeiro)</option>
                <option value="priority-desc">Prioridade (Mais alta primeiro)</option>
                <option value="priority-asc">Prioridade (Mais baixa primeiro)</option>
            </select>
        </div>

        <div class="ticket-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Ticket</th>
                        <th>Data de Criação</th>
                        <th>Data limite</th>
                        <th>Responsável</th>
                        <th>Status</th>
                        <th>Prioridade</th>
                    </tr>
                </thead>

                <tbody id="ticket-list">
                </tbody>
            </table>

        </div>

    </main>
    <script src="/js/project-navigation.js"></script>
    <script>
    async function loadTickets(status = "", priority = "") {
        try {
            const params = new URLSearchParams();

            if (status) {
                params.append("status", status);
            }

            if (priority) {
                params.append("priority", priority);
            }

            params.append("projectId", getProjectId());

            const url = `/api/tickets?${params.toString()}`;

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `Erro ao carregar tickets: ${response.status}`
                );
            }

            const tickets = await response.json();
            const sortedTickets = sortTickets(tickets, sortFilter.value);

            renderTickets(sortedTickets);

        } catch (error) {
            console.error("Erro ao carregar tickets:", error);
        }
    }

    function sortTickets(tickets, sortOption){
        const priorityOrder = {
            URGENT: 4,
            HIGH: 3,
            MEDIUM: 2,
            LOW: 1
        };

        return [...tickets].sort((a, b) => {
            switch(sortOption){
                case "created-desc":
                case "created-asc": {
                    const dateA = Date.parse(a.createdAt);
                    const dateB = Date.parse(b.createdAt);

                    const validA = Number.isFinite(dateA);
                    const validB = Number.isFinite(dateB);

                    if (!validA && !validB)
                        return 0;
                    if (!validA)
                        return 1;
                    if (!validB)
                        return -1;

                    return sortOption === "created-desc" ? dateB - dateA : dateA - dateB;
                }

                case "priority-desc":
                    return (priorityOrder[b.priority] ?? 0) - (priorityOrder[a.priority] ?? 0);

                case "priority-asc":
                    return (priorityOrder[a.priority] ?? 0) - (priorityOrder[b.priority] ?? 0);

                default:
                    return 0;
            }
        });
    }
    function formatCreationDate(value) {
        if (!value) {
            return "Não informada";
        }

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
            return "Não informada";
        }

        return new Intl.DateTimeFormat("pt-BR", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            timeZone: "America/Sao_Paulo"
        }).format(date);
    }

    function formatDueDate(value) {
        if (!value) {
            return "Sem prazo";
        }

        const [year, month, day] = value.split("-");
        return `${day}/${month}/${year}`;
    }

    function renderTickets(tickets) {

        const ticketList = document.getElementById("ticket-list");

        ticketList.replaceChildren();

        if (tickets.length === 0) {
            const row = document.createElement("tr");
            const cell = document.createElement("td");

            cell.colSpan = 7;
            cell.classList.add("empty-message");
            cell.textContent = "Nenhum ticket encontrado.";

            row.appendChild(cell);
            ticketList.appendChild(row);
            return;
        }

        tickets.forEach(ticket => {

            const ticketId = Number(ticket.id);

            if (!Number.isSafeInteger(ticketId) || ticketId <= 0) {
                return;
            }
            const row = document.createElement("tr");
            const idCell = document.createElement("td");

            idCell.textContent = ticket.id ?? "";
            row.appendChild(idCell);

            const titleCell = document.createElement("td");
            const link = document.createElement("a");

            link.href = getTicketDetailsUrl(ticketId);
            link.classList.add("ticket-link");
            link.textContent = ticket.title ?? "";

            titleCell.appendChild(link);
            row.appendChild(titleCell);

            const createdAtCell = document.createElement("td");
            createdAtCell.textContent = formatCreationDate(ticket.createdAt);
            row.appendChild(createdAtCell);

            const dueDateCell = document.createElement("td");

            const dueDateText = document.createElement("span");
            dueDateText.textContent = formatDueDate(ticket.dueDate);

            dueDateCell.appendChild(dueDateText);

            if (ticket.overdue) {
                const overdueBadge = document.createElement("span");

                overdueBadge.className = "deadline-alert";
                overdueBadge.textContent = "Atrasado";

                dueDateCell.appendChild(overdueBadge);
                row.classList.add("ticket-overdue");
            }

            row.appendChild(dueDateCell);

            const assigneeCell = document.createElement("td");
            assigneeCell.textContent = ticket.assignee ?? "";
            row.appendChild(assigneeCell);

            const statusCell = document.createElement("td");
            const status = document.createElement("span");

            status.classList.add("status");
            const statusClass = getStatusClass(ticket.status);
            if (statusClass) {
                status.classList.add(statusClass);
            }
            status.textContent = getStatusLabel(ticket.status);

            statusCell.appendChild(status);
            row.appendChild(statusCell);

            const priorityCell = document.createElement("td");
            const priority = document.createElement("span");

            priority.classList.add("priority");
            const priorityClass = getPriorityClass(ticket.priority);
            if (priorityClass) {
                priority.classList.add(priorityClass);
            }
            priority.textContent = getPriorityLabel(ticket.priority);

            priorityCell.appendChild(priority);
            row.appendChild(priorityCell);

            ticketList.appendChild(row);
        });
    }
    function getStatusClass(status) {
        switch (status) {
            case "OPEN":
                return "open";
            case "IN_PROGRESS":
                return "progress";
            case "RESOLVED":
                return "resolved";
            case "CLOSED":
                return "closed";
            default:
                return "";
        }
    }

    function getStatusLabel(status) {
        switch (status) {
            case "OPEN":
                return "Aberto";
            case "IN_PROGRESS":
                return "Em andamento";
            case "RESOLVED":
                return "Resolvido";
            case "CLOSED":
                return "Encerrado";
            default:
                return status ?? "Não informado";
        }
    }

    function getPriorityClass(priority) {

        switch (priority) {

            case "LOW":
                return "priority-low";

            case "MEDIUM":
                return "priority-medium";

            case "HIGH":
                return "priority-high";

            case "URGENT":
                return "priority-critical";

            default:
                return "";
        }
    }

    function getPriorityLabel(priority) {
        switch (priority) {
            case "LOW":
                return "Baixa";
            case "MEDIUM":
                return "Média";
            case "HIGH":
                return "Alta";
            case "URGENT":
                return "Crítica";
            default:
                return priority ?? "Não informada";
        }
    }

    function showSuccessMessage() {
        const message = sessionStorage.getItem('successMessage');

        if (!message){
            return;
        }
        const successMessage = document.createElement('div');
        successMessage.className = 'success-message';
        successMessage.textContent = message;

        document.querySelector('main').prepend(successMessage);
        sessionStorage.removeItem('successMessage');
    }

    const statusFilter =
        document.getElementById("status-filter");

    const priorityFilter =
        document.getElementById("priority-filter");

    const sortFilter =
        document.getElementById("sort-filter");

    function applyFilters() {
        loadTickets(
            statusFilter.value,
            priorityFilter.value
        );
    }

    statusFilter.addEventListener("change", applyFilters);
    priorityFilter.addEventListener("change", applyFilters);
    sortFilter.addEventListener("change", applyFilters);
    document.getElementById("new-ticket-button").href =
    getNewTicketUrl();

    document.getElementById("profile-link").addEventListener("click", () => {
    sessionStorage.setItem("profileReturnUrl", window.location.pathname);
    });

    showSuccessMessage();
    loadTickets();
</script>
</body>
</html>
