<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket System</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>

    <header>
    <div class="header-content">

        <h1>Ticket System</h1>

        <form th:action="@{/logout}" method="post">
            <button
                type="submit"
                class="logout-button">
                Sair
            </button>
        </form>

        <a th:href="@{/users/me}" class="profile-link">
            Meu Perfil
        </a>

    </div>
    </header>
    <main>

        <div class="page-header">
            <h2>Tickets</h2>

            <a class="new-ticket-button" th:href="@{/tickets/new}">
                Novo Ticket
            </a>
        </div>

        <div class="filter-container">
            <label for="status-filter">Filtrar por status</label>

            <select id="status-filter">
                <option value="">Todos</option>
                <option value="OPEN">Aberto</option>
                <option value="IN_PROGRESS">Em andamento</option>
                <option value="RESOLVED">Resolvido</option>
                <option value="CLOSED">Encerrado</option>
            </select>
        </div>

        <div class="filter-container">
            <label for="priority-filter">Filtrar por prioridade</label>

            <select id="priority-filter">
                <option value="">Todas</option>
                <option value="LOW">Baixa</option>
                <option value="MEDIUM">Média</option>
                <option value="HIGH">Alta</option>
                <option value="URGENT">Crítica</option>
            </select>
        </div>
        <div class="ticket-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Ticket</th>
                        <th>Projeto</th>
                        <th>Responsável</th>
                        <th>Status</th>
                        <th>Prioridade</th>
                    </tr>
                </thead>

                <tbody id="ticket-list">
                </tbody>
            </table>

        </div>

    </main>

    <script>
    async function loadTickets(status = "", priority ="") {

        try {
            let url = "/api/tickets";
            const params = new URLSearchParams();

            if (status) {
                params.append("status", status);
            }
            if (priority) {
                params.append("priority", priority);
            }
            if (params.toString()) {
                url += "?" + params.toString();
            }

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    "Erro ao buscar tickets. Status: " + response.status
                );
            }

            const tickets = await response.json();

            renderTickets(tickets);

        } catch (error) {
            console.error("Erro ao carregar tickets:", error);
        }
    }

    function renderTickets(tickets) {

        const ticketList =
            document.getElementById("ticket-list");

        ticketList.innerHTML = "";

        if (tickets.length === 0) {

            ticketList.innerHTML = `
                <tr>
                    <td colspan="6" class="empty-message">
                        Nenhum ticket encontrado.
                    </td>
                </tr>
            `;

            return;
        }

        tickets.forEach(ticket => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${ticket.id}</td>

                <td>
                    <a
                        href="/tickets/${ticket.id}"
                        class="ticket-link">
                        ${ticket.title}
                    </a>
                </td>

                <td>${ticket.project}</td>

                <td>${ticket.assignee}</td>

                <td>
                    ${ticket.status}
                </td>

                <td>
                    <span class="priority ${getPriorityClass(ticket.priority)}">
                        ${ticket.priority}
                    </span>
                </td>
            `;

            ticketList.appendChild(row);
        });
    }

    function getPriorityClass(priority) {

        switch (priority) {

            case "LOW":
                return "priority-low";

            case "MEDIUM":
                return "priority-medium";

            case "HIGH":
                return "priority-high";

            case "URGENT":
                return "priority-critical";

            default:
                return "";
        }
    }

    function showSuccessMessage() {
        const message = sessionStorage.getItem('successMessage');

        if (!message){
            return;
        }
        const successMessage = document.createElement('div');
        successMessage.className = 'success-message';
        successMessage.textContent = message;

        document.querySelector('main').prepend(successMessage);
        sessionStorage.removeItem('successMessage');
    }

    const statusFilter =
        document.getElementById("status-filter");

    const priorityFilter =
        document.getElementById("priority-filter");

    function applyFilters() {
        loadTickets(
            statusFilter.value,
            priorityFilter.value
        );
    }

    statusFilter.addEventListener("change", applyFilters);
    priorityFilter.addEventListener("change", applyFilters);

    showSuccessMessage();
    loadTickets();
</script>
</body>
</html>
