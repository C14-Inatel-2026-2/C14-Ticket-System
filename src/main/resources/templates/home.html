<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket System</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>

    <header>
    <div class="header-content">

        <h1>Ticket System</h1>

        <form th:action="@{/logout}" method="post">
            <button
                type="submit"
                class="logout-button">
                Sair
            </button>
        </form>

        <a th:href="@{/users/me}" class="profile-link" id="profile-link">
            Meu Perfil
        </a>

        <a href="/project" class="back-projects">
            ← Voltar aos projetos
        </a>

    </div>
    </header>
    <main>

        <div class="page-header">
            <h2>Tickets</h2>

            <a id="new-ticket-button" class="new-ticket-button" href="#">
                Novo Ticket
            </a>
        </div>

        <div class="filter-container">
            <label for="status-filter">Filtrar por status</label>

            <select id="status-filter">
                <option value="">Todos</option>
                <option value="OPEN">Aberto</option>
                <option value="IN_PROGRESS">Em andamento</option>
                <option value="RESOLVED">Resolvido</option>
                <option value="CLOSED">Encerrado</option>
            </select>
        </div>

        <div class="filter-container">
            <label for="priority-filter">Filtrar por prioridade</label>

            <select id="priority-filter">
                <option value="">Todas</option>
                <option value="LOW">Baixa</option>
                <option value="MEDIUM">Média</option>
                <option value="HIGH">Alta</option>
                <option value="URGENT">Crítica</option>
            </select>
        </div>
        <div class="ticket-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Ticket</th>
                        <th>Projeto</th>
                        <th>Responsável</th>
                        <th>Status</th>
                        <th>Prioridade</th>
                    </tr>
                </thead>

                <tbody id="ticket-list">
                </tbody>
            </table>

        </div>

    </main>
    <script src="/js/project-navigation.js"></script>
    <script>
    async function loadTickets(status = "", priority = "") {
        try {
            const params = new URLSearchParams();

            if (status) {
                params.append("status", status);
            }

            if (priority) {
                params.append("priority", priority);
            }

            const url = params.toString()
                ? `/api/tickets?${params.toString()}`
                : "/api/tickets";

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error(
                    `Erro ao carregar tickets: ${response.status}`
                );
            }

            const tickets = await response.json();

            renderTickets(tickets);

        } catch (error) {
            console.error("Erro ao carregar tickets:", error);
        }
    }

    function renderTickets(tickets) {

        const ticketList =
            document.getElementById("ticket-list");

        ticketList.innerHTML = "";

        if (tickets.length === 0) {

            ticketList.innerHTML = `
                <tr>
                    <td colspan="6" class="empty-message">
                        Nenhum ticket encontrado.
                    </td>
                </tr>
            `;

            return;
        }

        tickets.forEach(ticket => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${ticket.id}</td>

                <td>
                    <a
                        href="${getTicketDetailsUrl(ticket.id)}"
                        class="ticket-link">
                        ${ticket.title}
                    </a>
                </td>

                <td>${ticket.project}</td>

                <td>${ticket.assignee}</td>

                <td>
                    <span class="status ${getStatusClass(ticket.status)}">
                        ${getStatusLabel(ticket.status)}
                    </span>
                </td>

                <td>
                    <span class="priority ${getPriorityClass(ticket.priority)}">
                        ${getPriorityLabel(ticket.priority)}
                    </span>
                </td>
            `;

            ticketList.appendChild(row);
        });
    }
    function getStatusClass(status) {
        switch (status) {
            case "OPEN":
                return "open";
            case "IN_PROGRESS":
                return "progress";
            case "RESOLVED":
                return "resolved";
            case "CLOSED":
                return "closed";
            default:
                return "";
        }
    }

    function getStatusLabel(status) {
        switch (status) {
            case "OPEN":
                return "Aberto";
            case "IN_PROGRESS":
                return "Em andamento";
            case "RESOLVED":
                return "Resolvido";
            case "CLOSED":
                return "Encerrado";
            default:
                return status ?? "Não informado";
        }
    }

    function getPriorityClass(priority) {

        switch (priority) {

            case "LOW":
                return "priority-low";

            case "MEDIUM":
                return "priority-medium";

            case "HIGH":
                return "priority-high";

            case "URGENT":
                return "priority-critical";

            default:
                return "";
        }
    }

    function getPriorityLabel(priority) {
        switch (priority) {
            case "LOW":
                return "Baixa";
            case "MEDIUM":
                return "Média";
            case "HIGH":
                return "Alta";
            case "URGENT":
                return "Crítica";
            default:
                return priority ?? "Não informada";
        }
    }

    function showSuccessMessage() {
        const message = sessionStorage.getItem('successMessage');

        if (!message){
            return;
        }
        const successMessage = document.createElement('div');
        successMessage.className = 'success-message';
        successMessage.textContent = message;

        document.querySelector('main').prepend(successMessage);
        sessionStorage.removeItem('successMessage');
    }

    const statusFilter =
        document.getElementById("status-filter");

    const priorityFilter =
        document.getElementById("priority-filter");

    function applyFilters() {
        loadTickets(
            statusFilter.value,
            priorityFilter.value
        );
    }

    statusFilter.addEventListener("change", applyFilters);
    priorityFilter.addEventListener("change", applyFilters);
    document.getElementById("new-ticket-button").href =
    getNewTicketUrl();

    document.getElementById("profile-link").addEventListener("click", () => {
    sessionStorage.setItem("profileReturnUrl", window.location.pathname);
    });

    showSuccessMessage();
    loadTickets();
</script>
</body>
</html>
