<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket System</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>

    <header>
        <h1>Ticket System</h1>
    </header>

    <main>

        <div class="page-header">
            <h2>Tickets</h2>

            <button class="new-ticket-button">
                Novo Ticket
            </button>
        </div>

        <div class="ticket-container">

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome do Ticket</th>
                        <th>Projeto</th>
                        <th>Responsável</th>
                        <th>Status</th>
                        <th>Prioridade</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="ticket : ${tickets}">
                        <td th:text="${'#' + #numbers.formatInteger(ticket.id, 3)}">
                            #001
                        </td>
                        <td th:text="${ticket.title}">
                            Nome do ticket
                        </td>
                        <td th:text="${ticket.project}">
                            Projeto
                        </td>
                        <td th:text="${ticket.assignee}">
                            Responsável
                        </td>
                        <td>
                            <div th:switch="${ticket.status}">
                                <span
                                    th:case="${T(com.ibm.tickets.model.TicketStatus).OPEN}"
                                    class="status open">
                                    Aberto
                                </span>
                                <span
                                    th:case="${T(com.ibm.tickets.model.TicketStatus).IN_PROGRESS}"
                                    class="status progress">
                                    Em andamento
                                </span>
                                <span
                                    th:case="${T(com.ibm.tickets.model.TicketStatus).RESOLVED}"
                                    class="status resolved">
                                    Resolvido
                                </span>
                                <span
                                    th:case="${T(com.ibm.tickets.model.TicketStatus).CLOSED}"
                                    class="status closed">
                                    Fechado
                                </span>
                            </div>
                        </td>
                        <td>
                            <div th:switch="${ticket.priority}">
                                <span
                                    th:case="${T(com.ibm.tickets.model.TicketPriority).LOW}">
                                    Baixa
                                </span>
                                <span
                                    th:case="${T(com.ibm.tickets.model.TicketPriority).MEDIUM}">
                                    Média
                                </span>
                                <span
                                    th:case="${T(com.ibm.tickets.model.TicketPriority).HIGH}">
                                    Alta
                                </span>
                                <span
                                    th:case="${T(com.ibm.tickets.model.TicketPriority).URGENT}">
                                    Urgente
                                </span>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(tickets)}">
                        <td colspan="6" class="empty-message">
                            Nenhum ticket encontrado.
                        </td>
                    </tr>
                </tbody>
            </table>

        </div>

    </main>

</body>
</html>
