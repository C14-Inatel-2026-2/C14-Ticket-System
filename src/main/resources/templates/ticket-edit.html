<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Editar Ticket</title>

    <link rel="stylesheet" th:href="@{/css/new_ticket_style.css}">
</head>

<body>

<header>
    <h1>Ticket System</h1>
</header>

<main>

    <div class="page-header">
        <div>
            <h2>Editar Ticket</h2>
            <p th:text="'Editando o ticket #' + ${ticket.id}">
                Editando ticket
            </p>
        </div>
    </div>

    <div class="ticket-form-container">

        <form id="ticket-form">

            <div class="form-group">
                <label for="title">Título</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    th:value="${ticket.title}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="project">Projeto</label>

                <select id="project" name="project" required>
                    <option value="">Selecione um projeto</option>
                    <option value="Ticket System"
                            th:selected="${ticket.project == 'Ticket System'}">
                        Ticket System
                    </option>
                    <option value="Projeto de Teste"
                            th:selected="${ticket.project == 'Projeto de Teste'}">
                        Projeto de Teste
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="owner">Responsável</label>

                <input
                    type="text"
                    id="owner"
                    name="owner"
                    th:value="${ticket.assignee}"
                    placeholder="Nome do responsável"
                >
            </div>

            <div class="form-group">
                <label for="priority">Criticidade</label>

                <select id="priority" name="priority" required>
                    <option value="">Selecione</option>

                    <option value="LOW"
                            th:selected="${ticket.priority.name() == 'LOW'}">
                        Baixa
                    </option>

                    <option value="MEDIUM"
                            th:selected="${ticket.priority.name() == 'MEDIUM'}">
                        Média
                    </option>

                    <option value="HIGH"
                            th:selected="${ticket.priority.name() == 'HIGH'}">
                        Alta
                    </option>

                    <option value="URGENT"
                            th:selected="${ticket.priority.name() == 'URGENT'}">
                        Crítica
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Descrição</label>

                <textarea
                    id="description"
                    name="description"
                    rows="7"
                    required
                    th:text="${ticket.description}"
                ></textarea>
            </div>

            <div class="form-actions">

                <a th:href="@{/tickets/{id}(id=${ticket.id})}"
                   class="cancel-button">
                    Cancelar
                </a>

                <button type="submit" class="create-ticket-button">
                    Salvar Alterações
                </button>

            </div>

        </form>

    </div>

</main>
    <script th:inline="javascript">
        const form = document.getElementById('ticket-form');
        const ticketId = /*[[${ticket.id}]]*/ 0;

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (!checkIfFormIsValid()) {
                return;
            }

            const ticket = {
                title: document.getElementById('title').value.trim(),
                project: document.getElementById('project').value,
                assignee: document.getElementById('owner').value.trim(),
                priority: document.getElementById('priority').value,
                description: document.getElementById('description').value.trim()
            };

            try {
                const response = await fetch(`/api/tickets/${ticketId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(ticket)
                });

                if (!response.ok) {
                    throw new Error('Failed to update ticket');
                }

                window.location.href = `/tickets/${ticketId}`;

            } catch (error) {
                console.error('Error updating ticket:', error);
            }
        });

        function checkIfFormIsValid() {
            const title = document.getElementById('title').value.trim();
            const project = document.getElementById('project').value;
            const priority = document.getElementById('priority').value;
            const description = document.getElementById('description').value.trim();

            return title !== ''
                && project !== ''
                && priority !== ''
                && description !== '';
        }
    </script>
</body>
</html>
