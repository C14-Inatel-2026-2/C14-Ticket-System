<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes do Ticket</title>

    <link rel="stylesheet" th:href="@{/css/home.css}">
    <link rel="stylesheet" th:href="@{/css/ticket-details.css}">
    
</head>

<body>

<header>
    <div class="header-content">
        <h1>Ticket System</h1>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">
                Sair
            </button>
        </form>
    </div>
</header>

<main>

    <div class="details-page-header">
        <div class="details-heading">
            <h2>Detalhes do Ticket</h2>
            <p class="ticket-number"
            th:text="'Ticket #' + ${ticket.id}"></p>

            <div class="details-badges">
                <span class="status"
                    th:classappend="${ticket.status.toString() == 'OPEN' ? ' open' : (ticket.status.toString() == 'IN_PROGRESS' ? ' progress' : (ticket.status.toString() == 'RESOLVED' ? ' resolved' : (ticket.status.toString() == 'CLOSED' ? ' closed' : '')))}"
                    th:text="${ticket.status.toString() == 'OPEN' ? 'Aberto' : (ticket.status.toString() == 'IN_PROGRESS' ? 'Em andamento' : (ticket.status.toString() == 'RESOLVED' ? 'Resolvido' : (ticket.status.toString() == 'CLOSED' ? 'Encerrado' : ticket.status)))}">
                </span>

                <span class="priority"
                    th:classappend="${ticket.priority.toString() == 'LOW' ? ' priority-low' : (ticket.priority.toString() == 'MEDIUM' ? ' priority-medium' : (ticket.priority.toString() == 'HIGH' ? ' priority-high' : (ticket.priority.toString() == 'URGENT' ? ' priority-critical' : '')))}"
                    th:text="${ticket.priority.toString() == 'LOW' ? 'Baixa prioridade' : (ticket.priority.toString() == 'MEDIUM' ? 'Média prioridade' : (ticket.priority.toString() == 'HIGH' ? 'Alta prioridade' : (ticket.priority.toString() == 'URGENT' ? 'Crítica' : ticket.priority)))}">
                </span>
            </div>
        </div>

        <div class="details-actions">
            <div class="details-primary-actions">
                <a href="#" class="new-ticket-button" id="edit-button">
                    Editar
                </a>

                <a href="#" class="back-button" id="back-button">
                    Voltar
                </a>
            </div>

            <button type="button"
                    class="delete-button"
                    th:onclick="'deleteTicket(' + ${ticket.id} + ')'">
                Excluir ticket
            </button>
        </div>
    </div>

    <div class="ticket-details-container">

        <div class="ticket-detail ticket-title-detail">
            <strong>Título</strong>
            <p th:text="${ticket.title}"></p>
        </div>

        <div class="ticket-detail">
            <strong>Projeto</strong>
            <p th:text="${ticket.project}"></p>
        </div>

        <div class="ticket-detail">
            <strong>Responsável</strong>
            <p th:text="${ticket.assignee}"></p>
        </div>

        <div class="ticket-detail description-detail">
            <strong>Descrição</strong>
            <p th:text="${ticket.description}"></p>
        </div>

    </div>

</main>
<script src="/js/project-navigation.js"></script>
<script>
    async function deleteTicket(ticketId){
        const confirmed = confirm(
            "Tem certeza que deseja excluir esse ticket?"
        );

        if(!confirmed){
            return;
        }

        try{
            const response = await fetch(`/api/tickets/${ticketId}`,{
                method: 'DELETE'
            });
            
            if (!response.ok){
                throw new Error('Não foi possível deletar o ticket');
            }
            sessionStorage.setItem(
                'successMessage',
                'Ticket excluído com sucesso!'
            );

            backToTickets();
        } catch(error){
            console.error('Erro ao tentar deletar ticket: ', error);
        }
    }

    document.getElementById("back-button").href =
    getTicketsUrl();

    const ticketId = window.location.pathname.split("/").pop();

    document.getElementById("edit-button").href =
    getTicketEditUrl(ticketId);
</script>
</body>
</html>
