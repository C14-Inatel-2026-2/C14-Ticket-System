<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Ticket</title>

    <link rel="stylesheet" th:href="@{/css/new_ticket_style.css}">
</head>

<body>

<header>
    <h1>Ticket System</h1>
</header>

<main>

    <div class="page-header">
        <div>
            <h2>Novo Ticket</h2>
            <p>Preencha as informações para criar um novo ticket.</p>
        </div>
    </div>

    <div class="ticket-form-container">

        <form action="#" method="post">

            <div class="form-group">
                <label for="title">Título</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Digite o título do ticket"
                    required
                >
            </div>

            <div class="form-group">
                <label for="project">Projeto</label>

                <select id="project" name="project" required>
                    <option value="">Selecione um projeto</option>
                    <option value="1">Ticket System</option>
                    <option value="2">Projeto de Teste</option>
                </select>
            </div>

            <div class="form-group">
                <label for="owner">Responsável</label>

                <input
                    type="text"
                    id="owner"
                    name="owner"
                    placeholder="Nome do responsável"
                >
            </div>

            <div class="form-group">
                <label for="priority">Criticidade</label>

                <select id="priority" name="priority" required>
                    <option value="">Selecione</option>
                    <option value="LOW">Baixa</option>
                    <option value="MEDIUM">Média</option>
                    <option value="HIGH">Alta</option>
                    <option value="CRITICAL">Crítica</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Descrição</label>

                <textarea
                    id="description"
                    name="description"
                    rows="7"
                    placeholder="Descreva o problema ou solicitação..."
                    required
                ></textarea>
            </div>

            <div class="form-actions">

                <a th:href="@{/}" class="cancel-button">
                    Cancelar
                </a>

                <button type="submit" class="create-ticket-button">
                    Criar Ticket
                </button>

            </div>

        </form>

    </div>

</main>

</body>
</html>
