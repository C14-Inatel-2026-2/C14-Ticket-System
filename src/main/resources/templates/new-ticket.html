<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Novo Ticket</title>

    <link rel="stylesheet" th:href="@{/css/new_ticket_style.css}">
</head>

<body>

<header>
    <h1>Ticket System</h1>
</header>

<main>

    <div class="page-header">
        <div>
            <h2>Novo Ticket</h2>
            <p>Preencha as informações para criar um novo ticket.</p>
        </div>
    </div>

    <div class="ticket-form-container">

        <form id="ticket-form">
            <p id="form-feedback" class="form-feedback" role="alert" hidden></p>

            <div class="form-group">
                <label for="title">Título</label>

                <input
                    type="text"
                    id="title" aria-describedby="title-hint title-error" maxlength="150"
                    name="title"
                    placeholder="Digite o título do ticket"
                    required
                >
                <p id="title-hint" class="field-hint">Máximo de 150 caracteres.</p>
                <p id="title-error" class="field-error" hidden></p>
            </div>

            <div class="form-group">
                <label for="owner">Responsável</label>

                <input
                    type="text"
                    id="owner" aria-describedby="owner-hint owner-error" maxlength="100"
                    name="owner"
                    placeholder="Nome do responsável"
                    required
                >
                <p id="owner-hint" class="field-hint">Máximo de 100 caracteres.</p>
                <p id="owner-error" class="field-error" hidden></p>
            </div>

            <div class="form-group">
                <label for="priority">Criticidade</label>

                <select id="priority" aria-describedby="priority-error" name="priority" required>
                    <option value="">Selecione</option>
                    <option value="LOW">Baixa</option>
                    <option value="MEDIUM">Média</option>
                    <option value="HIGH">Alta</option>
                    <option value="URGENT">Crítica</option>
                </select>
                <p id="priority-error" class="field-error" hidden></p>
            </div>

            <div class="form-group">
                <label for="description">Descrição</label>

                <textarea
                    id="description" aria-describedby="description-error"
                    name="description"
                    rows="7"
                    placeholder="Descreva o problema ou solicitação..."
                    required
                ></textarea>
                <p id="description-error" class="field-error" hidden></p>
            </div>

            <div class="form-actions">

                <a href="#" class="cancel-button" id="cancel-button">
                    Cancelar
                </a>

                <button type="submit" class="create-ticket-button">
                    Criar Ticket
                </button>

            </div>

        </form>

    </div>

</main>
<script src="/js/project-navigation.js"></script>
<script>
    const form = document.getElementById('ticket-form');
    const feedback = document.getElementById('form-feedback');
    const fields = [
        {id: 'title', api: 'title', label: 'o título', max: 150, server: 'Title'},
        {id: 'owner', api: 'assignee', label: 'o responsável', max: 100, server: 'Assignee'},
        {id: 'priority', api: 'priority', label: 'a criticidade', server: 'Priority'},
        {id: 'description', api: 'description', label: 'a descrição', server: 'Description'}
    ];
    const genericError = 'Não foi possível criar o ticket. Seus dados foram mantidos. Tente novamente.';
    form.noValidate = true;

    function showFeedback(message) {
        feedback.textContent = message;
        feedback.hidden = !message;
    }

    function fieldError(field, message) {
        const input = document.getElementById(field.id);
        const error = document.getElementById(field.id + '-error');
        error.textContent = message;
        error.hidden = !message;
        if (message) input.setAttribute('aria-invalid', 'true');
        else input.removeAttribute('aria-invalid');
    }

    function requiredMessage(field) {
        if (field.id === 'priority') {
            return 'Selecione a criticidade.';
        }

        return 'Informe ' + field.label + '.';
    }
    function limitMessage(field) { return field.label.charAt(0).toUpperCase() + field.label.slice(1) + ' deve ter no máximo ' + field.max + ' caracteres.'; }
    function focusFirstError() {
        form.querySelector('[aria-invalid="true"]')?.focus();
    }

    async function getCurrentProjectName() {
        const response = await fetch("/api/projects");

        if (!response.ok) {
            throw new Error("Erro ao carregar projetos");
        }

        const projects = await response.json();

        const project = projects.find(
            item => String(item.id) === getProjectId()
        );

        if (!project) {
            throw new Error("Projeto não encontrado");
        }

        return project.name;
    }

    for (const field of fields) {
        const clear = () => fieldError(field, '');
        document.getElementById(field.id).addEventListener('input', clear);
        document.getElementById(field.id).addEventListener('change', clear);
    }

    form.addEventListener('submit', async function(event) {
        event.preventDefault();
        showFeedback('');
        let invalid = false;
        const ticket = {};
        for (const field of fields) {
            const value = document.getElementById(field.id).value;
            ticket[field.api] = value;
            const message = !value.trim() ? requiredMessage(field)
                : field.max && value.length > field.max ? limitMessage(field) : '';
            fieldError(field, message);
            invalid ||= Boolean(message);
        }
        if (invalid) {
            showFeedback('Revise os campos indicados antes de criar o ticket.');
            focusFirstError();
            return;
        }

        let response;

        try {
            ticket.project = await getCurrentProjectName();

            response = await fetch('/api/tickets', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(ticket)
            });

        } catch (error) {
            console.error("Erro ao criar ticket:", error);

            showFeedback(
                'Não foi possível criar o ticket. Seus dados foram mantidos.'
            );
            return;
        }
        if (response.ok) {
            backToTickets();
            return;
        }
        if (response.status === 401) {
            showFeedback('Sua sessão expirou. Entre novamente em outra aba e volte para enviar o formulário. Seus dados foram mantidos.');
            return;
        }
        if (response.status === 400) {
            let problem;
            try { problem = await response.json(); } catch (error) { /* Use the generic message below. */ }
            const errors = problem?.errors;
            let recognized = false;
            let unknown = false;
            if (errors && typeof errors === 'object' && !Array.isArray(errors)) {
                for (const [key, value] of Object.entries(errors)) {
                    const field = fields.find(item => item.api === key);
                    let message = '';
                    if (field && value === field.server + ' is required') message = requiredMessage(field);
                    else if (field?.max && value === field.server + ' must have at most ' + field.max + ' characters') message = limitMessage(field);
                    if (message) { fieldError(field, message); recognized = true; }
                    else unknown = true;
                }
            }
            if (recognized) {
                showFeedback(unknown ? genericError : 'Revise os campos indicados antes de criar o ticket.');
                focusFirstError();
                return;
            }
        }
        showFeedback(genericError);
    });
    document.getElementById("cancel-button").href = getTicketsUrl();

</script>

</body>
</html>
