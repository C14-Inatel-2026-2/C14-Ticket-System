
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil | C14 Tickets</title>

    <link rel="stylesheet" th:href="@{/css/user-profile.css}">
</head>

<body>

<header>
    <nav class="navbar">
        <h1>C14 Tickets</h1>

        <a href="/project" class="back-link" id="back-link">
            Voltar
        </a>
    </nav>
</header>

<main>

    <section class="profile-header card">
        <div class="avatar" id="user-avatar">-</div>

        <div class="profile-info">
            <h2 id="user-name">Carregando...</h2>
            <p id="user-email">-</p>
            <span class="role" id="user-role">-</span>
        </div>
    </section>

    <section class="stats-container">
        <div class="stat-card card">
            <h3 id="assigned-count">-</h3>
            <p>Tickets Atribuídos</p>
        </div>

        <div class="stat-card card">
            <h3 id="project-count">-</h3>
            <p>Projetos</p>
        </div>

        <div class="stat-card card">
            <h3 id="completed-count">-</h3>
            <p>Tickets Concluídos</p>
        </div>
    </section>

    <section class="projects card">
        <h3>Meus Projetos</h3>
        <ul id="project-list"></ul>
    </section>

    <section class="assigned-tickets card">
        <div class="tickets-header">
            <div>
                <h3>Meus Tickets</h3>
                <p>Tickets atribuídos a você.</p>
            </div>

            <span id="tickets-count">-</span>
        </div>

        <div id="tickets-list" class="tickets-list">
            <p class="tickets-message">Carregando tickets...</p>
        </div>
    </section>

</main>

<script>
"use strict";

const ticketsList = document.getElementById("tickets-list");
const ticketsCount = document.getElementById("tickets-count");

const statusLabels = {
    OPEN: "Aberto",
    IN_PROGRESS: "Em andamento",
    RESOLVED: "Resolvido",
    CLOSED: "Fechado"
};

const priorityLabels = {
    LOW: "Baixa",
    MEDIUM: "Média",
    HIGH: "Alta",
    URGENT: "Urgente"
};

async function fetchJson(url) {
    const response = await fetch(url);

    if (response.status === 401) {
        window.location.assign("/");
        throw new Error("Usuário não autenticado");
    }

    if (!response.ok) {
        throw new Error(`Erro HTTP ${response.status}`);
    }

    return response.json();
}

async function loadProfile() {
    try {
        const user = await fetchJson("/api/users/me");

        document.getElementById("user-name").textContent =
            user.name;

        document.getElementById("user-email").textContent =
            user.email;

        document.getElementById("user-role").textContent =
            user.role;

        document.getElementById("user-avatar").textContent =
            user.name.charAt(0).toUpperCase();

        document.getElementById("assigned-count").textContent =
            user.assignedTickets;

        document.getElementById("completed-count").textContent =
            user.completedTickets;

        document.getElementById("project-count").textContent =
            user.projects.length;

        const projectList =
            document.getElementById("project-list");

        projectList.replaceChildren();

        if (user.projects.length === 0) {
            const empty = document.createElement("li");
            empty.textContent = "Nenhum projeto associado.";
            projectList.appendChild(empty);
        }

        for (const project of user.projects) {
            const item = document.createElement("li");
            item.textContent = project;
            projectList.appendChild(item);
        }

    } catch (error) {
        console.error("Erro ao carregar perfil:", error);
    }
}

function createBadge(value, type, labels) {
    const badge = document.createElement("span");

    badge.className =
        `ticket-badge ${type}-${String(value).toLowerCase()}`;

    badge.textContent = labels[value] || value;

    return badge;
}

function renderTickets(tickets) {
    ticketsList.replaceChildren();

    ticketsCount.textContent =
        `${tickets.length} ticket(s)`;

    if (tickets.length === 0) {
        const empty = document.createElement("p");
        empty.className = "tickets-message";
        empty.textContent =
            "Você não possui tickets atribuídos.";

        ticketsList.appendChild(empty);
        return;
    }

    for (const ticket of tickets) {
        const card = document.createElement(
            ticket.projectId != null ? "a" : "div"
        );

        card.className = "assigned-ticket";

        if (ticket.projectId != null) {
            card.href =
                `/project/${ticket.projectId}/tickets/${ticket.id}`;
        }

        const info = document.createElement("div");
        info.className = "ticket-info";

        const title = document.createElement("strong");
        title.className = "ticket-title";
        title.textContent = `#${ticket.id} — ${ticket.title}`;

        const project = document.createElement("span");
        project.className = "ticket-project";
        project.textContent =
            ticket.project || "Sem projeto";

        info.append(title, project);

        const badges = document.createElement("div");
        badges.className = "ticket-badges";

        badges.append(
            createBadge(ticket.priority, "priority", priorityLabels),
            createBadge(ticket.status, "status", statusLabels)
        );

        card.append(info, badges);
        ticketsList.appendChild(card);
    }
}

async function loadTickets() {
    try {
        const tickets = await fetchJson(
            "/api/users/me/tickets"
        );

        renderTickets(tickets);

    } catch (error) {
        console.error("Erro ao carregar tickets:", error);

        ticketsCount.textContent = "-";
        ticketsList.replaceChildren();

        const message = document.createElement("p");
        message.className = "tickets-message";
        message.textContent =
            "Não foi possível carregar os tickets.";

        ticketsList.appendChild(message);
    }
}

const backLink = document.getElementById("back-link");
const returnUrl = sessionStorage.getItem("profileReturnUrl");

backLink.href = returnUrl || "/project";

backLink.addEventListener("click", () => {
    sessionStorage.removeItem("profileReturnUrl");
});

loadProfile();
loadTickets();
</script>

</body>
</html>
